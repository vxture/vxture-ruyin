name: ci

# Trunk-based CI: runs on PRs to main and on push:main (the squash commit that
# lands on main is a new SHA, so it gets its own gate run). Does NOT publish.
#
# Produces five of the six required status checks named in
# docs/50-deployment/rebuild/main-ruleset.json: `quality-gate` / `build` /
# `test-coverage` / `audit` / `packaged-smoke` (the sixth, `gitleaks`, is in
# secret-scan.yml). Job names are a stable contract - renaming one breaks
# branch protection.
#
# `packaged-smoke` is ruyin's own addition, not an org-wide standard: as a
# desktop-distribution repo the platform template explicitly excludes (CLAUDE.md,
# product_240 section 0.3), the other five can all be green while the shipped
# artifact does not start. It must always report - never a matrix leg, never
# skipped - because a required check that never reports reads as "CI still
# running" and blocks the branch forever.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI only type-checks/builds the shell's TS - it never launches Electron,
  # so skip the ~100MB binary download on every install.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # -- Audit (SCA hard gate) --------------------------------------------------
  # osv-scanner scans pnpm-lock.yaml's full dependency tree against the OSV
  # vulnerability database and hard-blocks on any new finding. Runs the pinned,
  # sha256-verified binary directly (no third-party action). The baseline is
  # empty (.osv-scanner.toml); new advisories must be fixed, not suppressed.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Single point of upgrade (see https://github.com/google/osv-scanner/releases).
      # Bump both the version and the sha256 below together.
      OSV_SCANNER_VERSION: "2.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache osv-scanner binary
        id: osv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/osv-bin
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64

      - name: Download osv-scanner (cache miss only)
        if: ${{ steps.osv-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          mkdir -p /tmp/osv-bin
          curl -fsSL "$url" -o /tmp/osv-bin/osv-scanner
          echo "${sha256}  /tmp/osv-bin/osv-scanner" | sha256sum -c -

      - name: OSV dependency scan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/osv-bin/osv-scanner
          # Must pass --config explicitly: when scanning a --lockfile,
          # osv-scanner does not auto-discover the repo-root config, so the
          # ignore baseline would silently not apply.
          # --allow-no-lockfiles: the governance-shell batch has zero runtime
          # dependencies, so the lockfile lists 0 packages; without this flag
          # osv-scanner exits 128 ("no package sources"). Once W2 adds real
          # dependencies the flag is a no-op and this becomes a real scan.
          /tmp/osv-bin/osv-scanner scan -L pnpm-lock.yaml --config .osv-scanner.toml --allow-no-lockfiles

  # -- Static checks (feed quality-gate) --------------------------------------
  # Pure-node, zero-dependency checks that run without a pnpm install. W2 adds
  # the contract-lint guardrail (the R-series semantic rules over
  # TD-004) here as it becomes real.
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Whitespace and conflict-marker check
        run: git diff --check

      - name: Docs numbering guardrail (strict)
        run: node scripts/guardrails/check-docs-numbering.mjs --strict

      # 通则 D-3：可自动判定的部分（错误码大小写、封套形状、拒绝词表）
      # 由仓内守卫脚本校验，而不是靠人记得。
      - name: Local API shape guardrail (integration standard X-1 / B-3)
        run: node scripts/guardrails/check-api-shape.mjs

      # 发布顺序：pnpm 会把 workspace:* 重写成具体版本，依赖没先发，包在注册表
      # 上就指向一个不存在的版本，而消费方要到 npm install 才发现。
      - name: Shared type shape guardrail (server <-> UI)
        run: node scripts/guardrails/check-shared-shapes.mjs

      - name: Update policy guardrail (TD-021, owner decisions)
        run: node scripts/guardrails/check-update-policy.mjs

      - name: Package publish order guardrail
        run: node scripts/guardrails/check-publish-order.mjs

      # 技术债表是给工具读的：某一行多切一列，表格照常渲染，而清点会静静地数错。
      - name: Tech-debt table parses (TD counts must be trustworthy)
        run: node scripts/guardrails/check-tech-debt-table.mjs

  # -- Contract lint (feed quality-gate) --------------------------------------
  # Runs the R-series semantic rules over every products/*/ruyin.product.yaml via the ruyin
  # CLI (design authority: docs/30-design/30-contract-schema.md section 15).
  contract-lint:
    name: contract-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Contract lint (R-series semantic rules)
        run: pnpm lint:contract
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # 品牌资源守卫住在这里而不是 static-checks：它要解析
      # @vxture/design-system 的包根，也就是需要 node_modules，而 static-checks
      # 是刻意不装依赖的纯 node 检查。
      - name: Brand asset guardrail (public/ copy vs design system)
        run: pnpm lint:brand-assets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  # -- Quality gate (aggregator; stable required-check name) ------------------
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [static-checks, contract-lint]
    steps:
      - name: Aggregate
        run: |
          echo "quality gate: all aggregated checks passed"

  # -- Build (required check) -------------------------------------------------
  # Installs the pnpm workspace and runs recursive type-check + build. With no
  # workspace packages yet both recurse over nothing and pass (TD-003); W2 makes
  # them real automatically as packages land - the job needs no rewrite.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # @vxture/* resolves from GitHub Packages once such deps exist (org
          # secret; empty string is fine while the workspace has none).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # Build BEFORE type-check: pnpm -r build is topological, so a package's
      # workspace dependencies have their dist/ (and .d.ts) in place before
      # dependents compile; bare type-check on a fresh checkout would fail to
      # resolve @vxture/* workspace deps that ship built types.
      - name: Build (all workspaces)
        run: pnpm build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Type-check (all workspaces)
        run: pnpm type-check:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  # -- Test coverage (required check) -----------------------------------------
  # Runs recursive `test` across the workspace. Coverage is measured and
  # thresholded INSIDE each package's own `test` script
  # (--experimental-test-coverage + --test-coverage-lines/-branches/-functions,
  # scoped to that package's own dist/ via --test-coverage-include so a change
  # in a dependency cannot flip an unrelated package's gate) - not here, so a
  # package with no threshold set is not silently assumed covered.
  #
  # TD-030: from TD-003's closure (2026-07-24) until 2026-09-02 this job ran
  # tests with no coverage measurement at all - "test-coverage" was, for
  # months, just "test" under a more reassuring name.
  #
  # apps/shell and apps/ui-workspace have no `test` script yet (TD-031);
  # `--if-present` skips them silently and this job does not check their code.
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Run tests
        run: pnpm test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  # -- Packaged launch verification (advisory, not one of the five required
  # contexts; see TD-025 and CLAUDE.md "Required checks").
  #
  # Everything else in this file can be green while producing an app that dies
  # on launch: the deployed dependency tree, the native binding ABI, the
  # resource layout and the shell<->daemon IPC are only exercised by running
  # the packaged thing. This job is the only place that does.
  #
  # It runs on Windows because that is what ships. It cannot run on a developer
  # machine with Windows application control enabled - an unsigned freshly
  # built exe is refused execution there (TD-025), which is exactly why the
  # gate has to live here.
  packaged-smoke:
    name: packaged-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      # Electron and electron-builder's binaries are the bulk of the wall
      # clock here; without this the job spends most of its time downloading
      # the same ~200MB every run.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      # pack.mjs is self-contained: install -> build -> deploy the daemon ->
      # electron-ABI native binding -> electron-builder -> launch the packaged
      # app with --smoke. The smoke step renders a real PDF through the shell
      # (ADR-017), so a broken IPC path fails here rather than at a user's
      # first export.
      - name: Pack and launch the packaged app
        run: node scripts/release/pack.mjs --dir
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
