name: release

# Tag-to-channel artifact release (docs/30-design/70-repo-organization.md
# section 7): beta-* -> beta channel (no gate), v*.*.* -> stable channel
# (production Environment required-reviewer gate). Merging never releases;
# only tag pushes do, and quality gates are NOT re-run here - a tag ships
# what main already verified.
#
# Publish target, until liaison L2 lands the dl host: GitHub Releases on
# this (public) repo. Two releases per push - the versioned one, immutable,
# and a rolling one per channel (tags "stable" / "beta") whose assets are
# always that channel's newest build, so a fixed URL
# (.../releases/download/<channel>/latest.yml) serves as the update feed and
# the download address. When L2 lands, the rsync step (tailnet-ssh-connect +
# staging, org CD idiom) is added next to it; the two can coexist.
# Run artifacts expire after 90 days; releases do not - that is the point.

on:
  push:
    tags:
      - "beta-*"
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-installer:
    name: build-installer
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Derive channel and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./apps/shell/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            CHANNEL=stable
            # A v-tag names the version, so the two must agree. Without this
            # check, tagging v0.2.0 while the package still says 0.1.0 builds
            # Ruyin-Setup-0.1.0.exe and publishes it AS v0.2.0 — the artifact,
            # the update feed and the download manifest would all carry a
            # version nobody released, and nothing would say so.
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match apps/shell/package.json version ${PKG_VERSION}." \
                   "Bump the package version and re-tag, or tag the version that is in the tree." >&2
              exit 1
            fi
          else
            # beta-YYYYMMDD.N carries a date, not a version, so the package is
            # the only source. Nothing to cross-check.
            CHANNEL=beta
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: node scripts/release/pack.mjs
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # Download urls in manifest.json point at the rolling channel release
      # on GitHub until the dl host exists (see the header).
      - name: Generate manifest + checksums
        shell: bash
        run: node scripts/release/make-manifest.mjs "${{ steps.meta.outputs.channel }}" "${{ steps.meta.outputs.version }}" "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.channel }}"

      # Flow C, MVP form (70-repo-organization s7.4): the static product
      # registry - one .ruyinpkg per product under products/ plus index.json.
      # Unsigned until the Registry root exists (TD-012 / TD-037); the index
      # says so per entry. Staged with the installer; published with it once
      # L2 lands (dl.vxture.com/ruyin/products/).
      - name: Build static product registry
        shell: bash
        run: node packages/cli/dist/main.js registry products --out apps/shell/release/products --base-url https://dl.vxture.com/ruyin/products

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ruyin-${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            apps/shell/release/*.exe
            apps/shell/release/*.blockmap
            apps/shell/release/latest.yml
            apps/shell/release/manifest.json
            apps/shell/release/SHA256SUMS
            apps/shell/release/products/**

  publish:
    name: publish
    needs: build-installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # v* tags pause here for the owner's approval; beta-* passes straight
    # through (org standard: production writes go through a human gate).
    environment: ${{ startsWith(github.ref_name, 'v') && 'production' || 'beta' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: ruyin-${{ needs.build-installer.outputs.channel }}-${{ needs.build-installer.outputs.version }}
          path: staged

      - name: Publish to GitHub Releases (interim distribution until L2)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: gh needs the repo named explicitly.
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.build-installer.outputs.channel }}
          VERSION: ${{ needs.build-installer.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la staged/
          # Installer + feed + manifest + sums. The products/ registry dir stays
          # on the run artifact only: release assets are flat and the static
          # registry is a directory tree (TD-037 covers its distribution).
          ASSETS=(staged/*.exe staged/*.blockmap staged/latest.yml staged/manifest.json staged/SHA256SUMS)
          PRE=(); [ "$CHANNEL" = "beta" ] && PRE=(--prerelease)

          # 1. The versioned release: immutable record of this exact build.
          #
          # 重跑要能跑通（2026-09-18）。beta-20260918.1 那次：assets 上传到一半
          # GitHub 的上传端回了一个 HTTP 500（`Error creating asset temp dir`），
          # 这一步红了；而**重跑死在这一行** —— 版本化的那个 release 已经建出来了，
          # `gh release create` 于是报「a release with the same tag name already
          # exists」，发布再也走不完。一次瞬时的上游 500 就把一个渠道钉死了，要人
          # 手工去删 release 才能重来。
          #
          # 改法：建过了就只补传（`--clobber` 覆盖同名的那几件）。**不会掩盖别的错**
          # —— 只有「这个 tag 的 release 已存在」这一种情况走补传，其余照样红。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在（多半是上一次跑到一半断了）—— 补传资产，不重建"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Ruyin $VERSION ($CHANNEL, $TAG)" \
              --notes "Channel: $CHANNEL. Unsigned installer (TD-001). Windows SmartScreen usually warns once: choose More info -> Run anyway. On a machine with Smart App Control on, the downloaded installer is blocked silently instead (double-click does nothing): run Unblock-File on the .exe in PowerShell first. Feed and manifest are the copies also served from the rolling '$CHANNEL' release." \
              "${PRE[@]}"
          fi

          # 2. The rolling channel release: a fixed address whose assets are
          #    always the newest build of the channel. Created once, then its
          #    assets are replaced; stale assets from older versions are removed
          #    so latest.yml and the files next to it never disagree.
          if ! gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release create "$CHANNEL" \
              --title "Ruyin $CHANNEL channel (rolling)" \
              --notes "Rolling release: assets are replaced on every $CHANNEL build. Update feed: releases/download/$CHANNEL/latest.yml. For a specific build use its versioned release." \
              "${PRE[@]}"
          fi
          #    **先传新的，再删旧的**（2026-09-18）。反过来做过一次，代价是实测到的：
          #    删除跑完、上传中途撞上 GitHub 的 500，于是这个渠道停在「一个安装包都
          #    没有」的状态上 —— 下载链接 404，更新 feed 也没了，而唯一的提示是
          #    Actions 里一条红的任务。顺序反过来之后，最坏的结果是渠道上多躺几件
          #    上一版的资产（下面那一轮会把它们清掉），而不是一件都不剩。
          gh release upload "$CHANNEL" "${ASSETS[@]}" --clobber
          KEEP=$(for f in "${ASSETS[@]}"; do basename "$f"; done)
          for old in $(gh release view "$CHANNEL" --json assets --jq '.assets[].name'); do
            if ! grep -qx "$old" <<<"$KEEP"; then
              gh release delete-asset "$CHANNEL" "$old" --yes
            fi
          done
          echo "published $TAG and refreshed rolling '$CHANNEL':"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/$CHANNEL/latest.yml"
