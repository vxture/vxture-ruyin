# pnpm workspace roots (docs/30-design/70-repo-organization.md section 4):
#   packages/  - libraries published to GitHub Packages, consumed outside this
#                repo (contract-schema / runtime-core / document / cli;
#                product-sdk is planned, not present)
#   apps/      - not published; shipped only inside the installer
#                (local-host / shell / ui-workspace)
#   products/  - the test fixture (bid), kept in-repo on purpose (TD-006,
#                standing). It has no package.json, so despite this glob it
#                is not a workspace package; the glob stays for a future one.
packages:
  - "packages/*"
  - "apps/*"
  - "products/*"

# Non-interactive module purge (electron-builder's prod-install probe leaves
# per-app node_modules in a state pnpm wants confirmation to repair; CI and
# scripts must never block on a prompt).
confirmModulesPurge: false

# Native modules allowed to run their build scripts (pnpm blocks postinstall
# by default). better-sqlite3 downloads/builds its prebuilt binding here.
# electron: since 42.0 the npm package has NO postinstall - the binary is
# fetched on the first `electron` run (or `pnpm exec install-electron`),
# honouring ELECTRON_MIRROR. The entry is kept so an older/newer line that
# reintroduces a script is not silently blocked.
allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  "@primno/dpapi": true
  electron-winstaller: false
  esbuild: true

# SCA remediation floors (governance 140 s9: pure transitive deps get root
# overrides). ini < 1.3.6: GHSA-qqgx-2p2h-9c37 prototype pollution, pulled in
# via better-sqlite3 -> prebuild-install -> rc.
overrides:
  # brace-expansion ReDoS GHSA-mh99-v99m-4gvg (fixed 5.0.8) + GHSA-rgw5-rvv9-x895
  # (fixed 5.0.9), and builder-util-runtime GHSA-p2f4-r6v6-j797 - all
  # transitive, floors below.
  "brace-expansion@<5.0.9": ">=5.0.9 <6"
  "builder-util-runtime@<9.7.0": ">=9.7.0"
  # ejs < 3.1.10: GHSA-ghr5-ch3p-vcr6; tar < 7.5.19: twelve advisories incl.
  # critical GHSA-23hp-3jrh-7fpw - both transitive via electron-builder 25.
  "ejs@<3.1.10": ">=3.1.10"
  "tar@<7.5.19": ">=7.5.19"
  "ini@<1.3.6": ">=1.3.6"
  # semver < 6.3.1: GHSA-c2qf-rxjj-qqgw ReDoS, transitive via electron's
  # download tooling.
  "semver@<6.3.1": ">=6.3.1"
  # 2026-08 OSV batch (all transitive; floors are bounded to the dependents'
  # own major so an unbounded '>=' cannot silently jump a major on refresh):
  #   fast-uri   < 3.1.5  GHSA-7p8r-x3mc-p8w7  via ajv (contract-schema, runtime)
  #   ip-address < 10.3.1 GHSA-22jq-vg5j-6vgg / GHSA-4xrf-jv44-h6hh /
  #                       GHSA-mwp4-54f8-5fhr  via socks <- node-gyp <- @electron/rebuild
  #   js-yaml    < 4.3.1  GHSA-5p4m-2wfm-xmqj  via app-builder-lib / builder-util
  #   nanoid     < 3.3.18 GHSA-2v37-7h3g-55p8  via postcss <- vite
  #   postcss    < 8.5.23 GHSA-fxqj-rqcc-2cmp  via vite
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  "ip-address@<10.3.1": ">=10.3.1 <11"
  "js-yaml@<4.3.1": ">=4.3.1 <5"
  "nanoid@<3.3.18": ">=3.3.18 <4"
  "postcss@<8.5.23": ">=8.5.23 <9"
  # 2026-09-03: @xmldom/xmldom < 0.9.12 GHSA-6gmq-8vp8-gcm6, transitive via
  # plist <- @electron/osx-sign <- app-builder-lib (electron-builder 25, build-time
  # only, never shipped). Bounded to 0.x like the batch above.
  "@xmldom/xmldom@<0.9.12": ">=0.9.12 <1"
